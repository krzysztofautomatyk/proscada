name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Validate agent context
        run: |
          npm run validate:widgets
          npm run validate:docs
          npm run validate:ai
          npm run validate:yaml
          npm run test:pump-template

      - name: Precompile Rust tests
        run: cargo test --locked --no-run --manifest-path src-tauri/Cargo.toml
