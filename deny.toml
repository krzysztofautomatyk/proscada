# Dependency policy for `cargo deny`. Keep exceptions explicit, justified and
# time-bounded so every matching RustSec advisory remains visible.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  # Linux-only Tauri/GTK transitive dependency. The vulnerable VariantStrIter
  # API is not used by ProScada, and the current Tauri lock has no fixed path.
  # Review or remove this exception by 2026-10-31.
  { id = "RUSTSEC-2024-0429", reason = "Linux Tauri/GTK path; VariantStrIter is unused; review by 2026-10-31" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
