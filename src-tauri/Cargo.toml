[package]
name = "proscada"
version = "1.0.0"
description = "ProScada — high-assurance SCADA designer & runtime with Modbus TCP master"
authors = ["ProScada Expert Council"]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"

[lib]
name = "proscada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-modbus = { version = "0.16", default-features = false, features = ["tcp"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
